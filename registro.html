<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./assets/registro.css" />
    <title>Registro</title>
  </head>
  <body>
    <header>
      <div class="navbar">
        <a href="./index.html">
          <img src="./assets/imgs/Logo.jpg" alt="Logo" class="logo" />
        </a>
      </div>
    </header>
    <main>
      <section class="signup">
        <div class="signup-container">
          <div class="signup-title">
            <h1>Crear cuenta</h1>
            <p>Completá tus datos para registrarte</p>
          </div>
          <div class="signup-form">
            <label class="norm-label" for="nombre">Nombre y apellido</label>
            <input
              class="norm-input"
              type="text"
              id="nombre"
              placeholder="Nombre y apellido"
            />
            <label class="norm-label" for="email">Email*</label>
            <input
              class="norm-input"
              type="email"
              id="email"
              placeholder="tu@email.com"
            />
            <label class="norm-label" for="password">Contraseña*</label>
            <input class="norm-input" type="password" id="password" />
            <label class="norm-label" for="password2"
              >Confirmar constraseña</label
            >
            <input class="norm-input" type="password" id="password2" />
          </div>
          <div class="signup-button">
            <a href="./index.html">Registrate</a>
          </div>
          <div class="signup-login">
            <p>¿Ya tenes cuenta? <a href="./login.html">Inicia Sesión</a></p>
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
